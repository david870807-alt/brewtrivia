<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BrewTrivia — Bar trivia near you</title>
  <meta name="theme-color" content="#0A1330">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BrewTrivia">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{
      --night:#0A1330; --deep:#0F1D45; --card:#16265A; --line:#283B75;
      --gold:#E8A93C; --brick:#C8492D; --teal:#3FA093; --cream:#F5EBD9; --muted:#93A4CE;
      --display:'Instrument Serif',Georgia,serif;
      --body:'Inter',system-ui,-apple-system,sans-serif;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%}
    body{background:linear-gradient(180deg,var(--night) 0%,var(--deep) 100%);color:var(--cream);
      font-family:var(--body);font-size:15px;display:flex;justify-content:center}
    #app{width:100%;max-width:480px;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
      padding-top:env(safe-area-inset-top,0px)}
    .pane{flex:1;overflow-y:auto;padding:0 18px 24px;-webkit-overflow-scrolling:touch}
    .anim{animation:fade .3s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.anim{animation:none}}

    .bar{display:flex;align-items:center;gap:12px;padding:18px 18px 14px}
    .bar h1{font-family:var(--display);font-size:22px;font-weight:400;margin:0;flex:1;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar .sub{font-size:12px;color:var(--muted);margin-top:1px}
    .back{background:var(--card);border:0;border-radius:99px;width:34px;height:34px;color:var(--cream);font-size:18px;cursor:pointer}

    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
    .card.live{border-color:var(--gold)}
    .row{display:flex;align-items:center;gap:12px}
    .grow{flex:1;min-width:0}
    .trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .muted{color:var(--muted)} .small{font-size:12px} .gold{color:var(--gold)} .teal{color:var(--teal)}
    .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:16px 0 10px}

    button{font-family:var(--body)}
    .btn{width:100%;border:0;border-radius:16px;padding:15px;background:var(--gold);color:#0A1330;
      font-weight:600;font-size:15px;cursor:pointer;transition:transform .1s}
    .btn:active{transform:scale(.985)}
    .btn.teal{background:var(--teal)}
    .btn[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
    .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--cream);font-weight:500}
    .btn.mt{margin-top:10px}

    label{display:block;margin-bottom:14px}
    label span{font-size:12px;color:var(--muted)}
    input,textarea{width:100%;margin-top:7px;background:var(--deep);border:1px solid var(--line);
      border-radius:12px;padding:13px 14px;color:var(--cream);font-size:15px;font-family:var(--body);outline:none}
    input:focus,textarea:focus{border-color:var(--gold)}
    input::placeholder,textarea::placeholder{color:var(--muted);opacity:.55}
    .half{display:flex;gap:10px} .half label{flex:1}

    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
    .chip{background:var(--card);border:1px solid var(--line);color:var(--cream);border-radius:99px;
      padding:9px 14px;font-size:13px;cursor:pointer}
    .chip.on{background:var(--teal);border-color:var(--teal);color:#0A1330;font-weight:600}
    .chip.gold.on{background:var(--gold);border-color:var(--gold)}
    .nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
    .num{background:var(--card);border:1px solid var(--line);color:var(--cream);border-radius:12px;
      height:48px;font-size:16px;font-weight:600;cursor:pointer}
    .num.on{background:var(--gold);border-color:var(--gold);color:#0A1330}

    .addr{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:0;
      color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;max-width:100%}
    .addr.gold{color:var(--gold)}
    .badge{border-radius:99px;padding:4px 9px;font-size:10.5px}
    .badge.day{background:var(--deep);color:var(--muted)}
    .badge.prize{background:rgba(232,169,60,.15);color:var(--gold);font-weight:600}

    .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
      border:1px solid var(--line);border-radius:16px;padding:15px;color:var(--cream);font-size:15px;margin-bottom:10px;cursor:pointer}
    .opt .key{width:30px;height:30px;border-radius:9px;background:var(--deep);color:var(--gold);
      font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .opt.right{background:var(--teal);border-color:var(--teal);color:#0A1330}
    .opt.wrong{background:var(--brick);border-color:var(--brick);color:#0A1330}
    .opt.right .key,.opt.wrong .key{background:rgba(10,19,48,.18);color:#0A1330}

    .win{background:var(--gold);color:#0A1330;border-radius:18px;padding:20px;text-align:center;margin-bottom:14px}
    .win .who{font-family:var(--display);font-size:32px;line-height:1.15;margin-top:4px}
    .me{background:var(--gold)!important;border-color:var(--gold)!important;color:#0A1330!important}
    .code{font-family:var(--display);font-size:24px;letter-spacing:.06em}

    .tabs{display:flex;border-top:1px solid var(--line);background:var(--night);flex:0 0 auto;
      padding-bottom:env(safe-area-inset-bottom,0px)}
    .tab{flex:1;background:none;border:0;color:var(--muted);padding:11px 0 14px;font-size:11px;cursor:pointer}
    .tab .ic{font-size:17px;display:block;margin-bottom:3px}
    .tab.on{color:var(--gold);font-weight:600}

    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--brick);
      color:var(--cream);padding:11px 18px;border-radius:99px;font-size:13px;z-index:9;max-width:90%}
    .toast.ok{background:var(--teal);color:#0A1330}
    .spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--gold);
      border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
    @keyframes sp{to{transform:rotate(360deg)}}
    .ring{transition:stroke-dashoffset 1s linear}
    .dot{width:6px;height:6px;border-radius:99px;background:var(--teal);display:inline-block;
      animation:blink 1.6s ease-in-out infinite;margin-right:6px}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  </style>
</head>
<body>
<div id="app"><div class="spin"></div></div>

<script>
/* ───────── config & client ───────── */
var CFG = window.BREWTRIVIA || {};
var READY = !!(CFG.SUPABASE_URL && CFG.SUPABASE_KEY)
  && CFG.SUPABASE_URL.indexOf('YOUR-') < 0 && CFG.SUPABASE_KEY.indexOf('YOUR-') < 0;
function store(k,v){ try{ v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function uuid(){ return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){ var r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }); }
var GUEST = { id: load('brewGuestId'), key: load('brewGuestKey') };
if(!GUEST.id || !GUEST.key){ GUEST = { id: uuid(), key: uuid() }; store('brewGuestId', GUEST.id); store('brewGuestKey', GUEST.key); }
var sb = READY ? supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { global: { headers: { 'x-guest-token': GUEST.id } } }) : null;
var APP = CFG.APP_NAME || 'BrewTrivia';
var KEYS = ['A','B','C','D'];
var DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var STATE_TZ = {
  AL:'America/Chicago',AK:'America/Anchorage',AZ:'America/Phoenix',AR:'America/Chicago',CA:'America/Los_Angeles',
  CO:'America/Denver',CT:'America/New_York',DE:'America/New_York',DC:'America/New_York',FL:'America/New_York',
  GA:'America/New_York',HI:'Pacific/Honolulu',ID:'America/Boise',IL:'America/Chicago',IN:'America/Indiana/Indianapolis',
  IA:'America/Chicago',KS:'America/Chicago',KY:'America/New_York',LA:'America/Chicago',ME:'America/New_York',
  MD:'America/New_York',MA:'America/New_York',MI:'America/Detroit',MN:'America/Chicago',MS:'America/Chicago',
  MO:'America/Chicago',MT:'America/Denver',NE:'America/Chicago',NV:'America/Los_Angeles',NH:'America/New_York',
  NJ:'America/New_York',NM:'America/Denver',NY:'America/New_York',NC:'America/New_York',ND:'America/Chicago',
  OH:'America/New_York',OK:'America/Chicago',OR:'America/Los_Angeles',PA:'America/New_York',RI:'America/New_York',
  SC:'America/New_York',SD:'America/Chicago',TN:'America/Chicago',TX:'America/Chicago',UT:'America/Denver',
  VT:'America/New_York',VA:'America/New_York',WA:'America/Los_Angeles',WV:'America/New_York',WI:'America/Chicago',
  WY:'America/Denver'
};

/* ───────── state ───────── */
var S = {
  screen:'boot', tab:'venues', uid:null, anon:true, name:'', totalPoints:0,
  venues:[], myVenue:null, venue:null, questions:[], editorQs:[],
  qi:0, picked:null, score:0, left:20, timer:null, channel:null,
  team:'', players:1, board:[], rating:[], range:'all',
  search:'', coords:null, sortNear:false, tonightOnly:false,
  busy:false, toast:'', toastOk:false, showEmail:false, correct:0, draft:[], qdraft:'', newDay:''
};

/* ───────── helpers ───────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function val(id){ var el=document.getElementById(id); return el ? el.value.trim() : ''; }
function toast(m, ok){ S.toast=m; S.toastOk=!!ok; render(); setTimeout(function(){ S.toast=''; render(); }, 3400); }
function busy(b){ S.busy=b; render(); }
function go(screen){ stopLive(); S.screen=screen; render(); }
function todayName(){ return DAYS[(new Date().getDay()+6)%7]; }
function venueById(id){
  if(S.myVenue && S.myVenue.id===id) return S.myVenue;
  return S.venues.filter(function(v){ return v.id===id; })[0];
}
function mapsFor(id){
  var v = venueById(id); if(!v) return;
  var q = v.address + (v.city ? ', '+v.city : '') + (v.state ? ', '+v.state : '');
  window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q), '_blank', 'noopener');
}
function miles(a,b,c,d){
  var R=3958.8, p=Math.PI/180;
  var x=0.5-Math.cos((c-a)*p)/2 + Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function useMyLocation(){
  if(!navigator.geolocation) return toast('Location is not available on this device');
  navigator.geolocation.getCurrentPosition(function(pos){
    S.coords={lat:pos.coords.latitude, lng:pos.coords.longitude}; S.sortNear=true; render();
  }, function(){ toast('Location blocked — search by city or state instead'); },
  {timeout:8000, maximumAge:600000});
}
/** THEB-7PM style join code from the venue name and start time */
function makeCode(name, time){
  var stem = String(name).replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase() || 'QUIZ';
  var m = String(time||'').match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i);
  var tail = m ? m[1]+(m[2]&&m[2]!=='00'?m[2]:'')+m[3].toUpperCase() : 'TRIV';
  return stem+'-'+tail;
}
/** Free US geocoding (Census Bureau) — no key. Falls back to JSONP if CORS is blocked. */
function geocode(address){
  var base = 'https://geocoding.geo.census.gov/geocoder/locations/onelineaddress?benchmark=Public_AR_Current&address='+encodeURIComponent(address);
  function parse(j){
    var m = j && j.result && j.result.addressMatches && j.result.addressMatches[0];
    return m ? {lat:m.coordinates.y, lng:m.coordinates.x} : {lat:null, lng:null};
  }
  return fetch(base+'&format=json').then(function(r){ return r.json(); }).then(parse)
    .catch(function(){ return jsonp(base+'&format=jsonp').then(parse).catch(function(){ return {lat:null,lng:null}; }); });
}
function jsonp(url){
  return new Promise(function(res, rej){
    var cb = 'tb_cb_'+Date.now();
    var s = document.createElement('script');
    var t = setTimeout(function(){ cleanup(); rej(new Error('timeout')); }, 8000);
    function cleanup(){ delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); clearTimeout(t); }
    window[cb] = function(d){ cleanup(); res(d); };
    s.onerror = function(){ cleanup(); rej(new Error('jsonp failed')); };
    s.src = url+'&callback='+cb;
    document.head.appendChild(s);
  });
}

/* ───────── boot & data ───────── */
async function boot(){
  if(!READY){ S.screen='setup'; return render(); }
  try{
    var got = await sb.auth.getSession();
    var session = got.data.session;
    S.uid = session ? session.user.id : null;
    S.anon = !S.uid;
    if(S.uid && load('brewGuestOn')){ await sb.rpc('claim_guest_scores'); store('brewGuestOn', null); }
    await loadAll();
    S.screen = (S.uid || (load('brewGuestOn') && S.name)) ? 'app' : 'auth';
    render();
  }catch(e){ S.screen='error'; S.toast=e.message||String(e); render(); }
}
async function loadAll(){
  var res = await Promise.all([
    sb.from('venues').select('*, questions(count)').order('created_at'),
    S.uid ? sb.from('profiles').select('display_name').eq('id', S.uid).maybeSingle()
          : sb.from('guests').select('display_name').eq('id', GUEST.id).maybeSingle(),
    sb.rpc('my_stats')
  ]);
  if(res[0].error) throw res[0].error;
  S.venues = (res[0].data||[]).map(function(v){
    v.questionCount = (v.questions && v.questions[0] && v.questions[0].count) || 0; return v;
  });
  S.myVenue = S.venues.filter(function(v){ return (S.uid && v.owner_id===S.uid) || (!S.uid && v.owner_key===GUEST.key); })[0] || null;
  S.name = (res[1] && res[1].data) ? res[1].data.display_name : '';
  var st = res[2] && res[2].data && res[2].data[0];
  S.totalPoints = st ? Number(st.points) || 0 : 0;
}
if(sb) sb.auth.onAuthStateChange(function(event){
  if(event==='SIGNED_OUT'){ S.uid=null; S.anon=true; S.name=''; S.myVenue=null; S.totalPoints=0; go('auth'); }
});

/* ───────── sign in ───────── */
async function startPlaying(){
  var name = val('pname'); if(!name) return toast('Enter a name');
  busy(true);
  try{
    if(!S.uid){
      var r = await sb.from('guests').upsert({ id:GUEST.id, key:GUEST.key, display_name:name });
      if(r.error) throw r.error;
      store('brewGuestOn', '1'); S.anon = true; S.name = name;
    } else {
      await saveName(name);
    }
    await loadAll();
    S.tab='venues'; S.busy=false; go('app');
  }catch(e){ S.busy=false; toast(e.message||String(e)); }
}
async function saveName(name){
  var r = await sb.from('profiles').upsert({ id:S.uid, display_name:name });
  if(r.error) throw r.error;
  S.name = name;
}
async function oauth(provider){
  var opts = { redirectTo: location.origin + location.pathname };
  var r = await sb.auth.signInWithOAuth({ provider:provider, options:opts });
  if(r.error) toast(r.error.message);
}
async function emailLink(){
  var email = val('email'); if(!email) return toast('Enter your email');
  busy(true);
  var r = await sb.auth.signInWithOtp({ email:email, options:{ emailRedirectTo: location.origin + location.pathname } });
  S.busy=false;
  if(r.error) return toast(r.error.message);
  toast('Check your inbox and tap the link', true);
}
async function signOut(){
  stopLive();
  if(S.uid){ await sb.auth.signOut(); return; }
  store('brewGuestOn', null); S.name=''; S.totalPoints=0; go('auth');
}

/* ───────── playing ───────── */
async function openVenue(id){
  S.venue = venueById(id);
  busy(true);
  var r = await sb.from('questions').select('*').eq('venue_id', id).order('sort_order').order('created_at');
  S.busy=false;
  if(r.error) return toast(r.error.message);
  S.questions = r.data||[]; S.team = S.name||''; S.players=1; go('lobby');
}
function startQuiz(){
  var name = val('team'); if(!name) return toast('Enter a team name');
  if(!S.questions.length) return toast('This venue has not written any questions yet');
  S.team=name; S.qi=0; S.score=0; S.picked=null; S.left=20; S.screen='quiz'; render(); tick();
}
function tick(){
  clearInterval(S.timer);
  S.timer = setInterval(function(){
    if(S.picked!==null) return;
    S.left--;
    if(S.left<=0){ S.picked=-1; clearInterval(S.timer); setTimeout(next,1600); }
    render();
  },1000);
}
function answer(i){
  if(S.picked!==null) return;
  S.picked=i; clearInterval(S.timer);
  if(i===S.questions[S.qi].correct) S.score += 100 + S.left*10;
  render(); setTimeout(next,1600);
}
async function next(){
  if(S.qi+1 < S.questions.length){ S.qi++; S.picked=null; S.left=20; render(); tick(); return; }
  busy(true);
  var row = { venue_id:S.venue.id, team_name:S.team, players:S.players, score:S.score };
  if(S.uid) row.user_id = S.uid; else row.guest_key = GUEST.key;
  var r = await sb.from('scores').insert(row);
  if(r.error){ S.busy=false; toast(r.error.message); return go('app'); }
  S.totalPoints += S.score;
  await loadBoard(S.venue.id);
  S.busy=false; go('result'); live(S.venue.id);
}
async function loadBoard(id){
  var r = await sb.rpc('venue_board', { venue:id });
  if(!r.error) S.board = r.data||[];
}
function live(id){
  stopLive();
  S.channel = sb.channel('board-'+id)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'scores', filter:'venue_id=eq.'+id },
      function(){ loadBoard(id).then(render); })
    .subscribe();
}
function stopLive(){ if(S.channel){ sb.removeChannel(S.channel); S.channel=null; } }
async function loadRating(range){
  S.range=range; busy(true);
  var r = await sb.rpc('ranking', { period:range });
  S.busy=false;
  if(r.error) return toast(r.error.message);
  S.rating = r.data||[]; render();
}

/* ───────── venue side ───────── */
async function saveVenue(){
  var d = {
    name:val('vname'), address:val('vaddr'), city:val('vcity'), state:val('vstate').toUpperCase(),
    prize:val('vprize'), quiz_day: S.newDay || (S.myVenue && S.myVenue.quiz_day) || 'Wednesday',
    start_time: val('vtime') || '7:00 PM'
  };
  if(!d.name || !d.address) return toast('Name and address are required');
  busy(true);
  d.code = makeCode(d.name, d.start_time);
  d.tz = STATE_TZ[d.state] || 'America/New_York';
  var geo = await geocode(d.address+', '+d.city+', '+d.state);
  d.lat = geo.lat; d.lng = geo.lng;
  var r = S.myVenue
    ? await sb.from('venues').update(d).eq('id', S.myVenue.id).select().single()
    : await sb.from('venues').insert(Object.assign(S.uid ? { owner_id:S.uid } : { owner_key:GUEST.key }, d)).select().single();
  S.busy=false;
  if(r.error) return toast(r.error.message);
  var saved = r.data;
  await loadAll();
  if(!S.myVenue){ saved.questionCount = 0; S.myVenue = saved; }
  openEditor();
}
async function openEditor(){
  busy(true);
  var r = await sb.from('questions').select('*').eq('venue_id', S.myVenue.id).order('sort_order').order('created_at');
  S.busy=false;
  if(r.error) return toast(r.error.message);
  S.editorQs = r.data||[]; S.correct=0; go('editor');
}
function keepDraft(){
  S.draft = [0,1,2,3].map(function(i){ return val('a'+i); });
  S.qdraft = val('qtext');
}
async function addQuestion(){
  keepDraft();
  if(!S.qdraft || S.draft.filter(Boolean).length < 4) return toast('Fill in the question and all four answers');
  busy(true);
  var r = await sb.from('questions').insert({
    venue_id:S.myVenue.id, question:S.qdraft, answers:S.draft, correct:S.correct||0,
    category: val('qcat') || 'General', sort_order:S.editorQs.length
  }).select().single();
  S.busy=false;
  if(r.error) return toast(r.error.message);
  S.editorQs.push(r.data); S.correct=0; S.draft=[]; S.qdraft='';
  S.myVenue.questionCount = S.editorQs.length; render();
}
async function delQuestion(id){
  var r = await sb.from('questions').delete().eq('id', id);
  if(r.error) return toast(r.error.message);
  S.editorQs = S.editorQs.filter(function(q){ return q.id!==id; });
  S.myVenue.questionCount = S.editorQs.length; render();
}
async function openDash(){
  busy(true);
  await loadBoard(S.myVenue.id);
  var r = await sb.from('questions').select('id').eq('venue_id', S.myVenue.id);
  S.editorQs = r.data||[];
  S.busy=false; go('dash'); live(S.myVenue.id);
}

/* ───────── screens ───────── */
function bar(title, sub, back){
  return '<div class="bar">'+(back?'<button class="back" onclick="'+esc(back)+'">‹</button>':'')+
    '<div class="grow"><h1>'+esc(title)+'</h1>'+(sub?'<div class="sub trunc">'+esc(sub)+'</div>':'')+'</div></div>';
}
function addrBtn(v, cls){
  return '<button class="addr '+(cls||'')+'" onclick="mapsFor(\''+v.id+'\')">📍 <span class="trunc">'+
    esc(v.address)+(v.city?', '+esc(v.city):'')+(v.state?', '+esc(v.state):'')+'</span></button>';
}
function providers(){
  return '<button class="btn ghost" onclick="oauth(\'google\')">Continue with Google</button>'+
    '<button class="btn ghost mt" onclick="oauth(\'apple\')">Continue with Apple</button>'+
    '<button class="btn ghost mt" onclick="S.showEmail=!S.showEmail;render()">Email me a sign-in link</button>'+
    (S.showEmail?'<div class="card" style="margin-top:12px"><label><span>Email — Gmail, iCloud, Amazon, anything</span>'+
      '<input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></label>'+
      '<button class="btn" onclick="emailLink()" '+(S.busy?'disabled':'')+'>Send link</button></div>':'');
}
function screenSetup(){
  return bar(APP+' — setup')+'<div class="pane"><div class="card" style="line-height:1.8">'+
    '<b>config.js</b> still has placeholder values.<br>'+
    '1. Create a free project at supabase.com<br>'+
    '2. SQL Editor → paste <b>supabase/schema.sql</b> → Run<br>'+
    '3. Project Settings → API → copy the URL and key into <b>config.js</b><br>'+
    '4. Reload this page</div></div>';
}
function screenAuth(){
  if(S.anon && S.name){
    return bar('Keep your points','Sign in to play on any phone','go(\'app\')')+
      '<div class="pane anim"><p class="muted" style="margin:0 0 18px;line-height:1.6">Guest points and your venue live on this phone only. Sign in and they move to your account, so you can use any phone.</p>'+
      providers()+'</div>';
  }
  return '<div class="pane anim" style="display:flex;flex-direction:column;justify-content:center">'+
    '<div class="eyebrow" style="margin:0;color:var(--gold)">Bar trivia, every night of the week</div>'+
    '<h1 style="font-family:var(--display);font-size:46px;font-weight:400;line-height:1.05;margin:8px 0 14px">Where\'s<br>trivia<br>tonight?</h1>'+
    '<p class="muted" style="margin:0 0 22px;line-height:1.6">Pick a name and start playing. No app store, no email, no waiting.</p>'+
    '<label><span>Your name or team name</span><input id="pname" placeholder="e.g. Quizzy McGuire" value="'+esc(S.name)+'"></label>'+
    '<button class="btn" onclick="startPlaying()" '+(S.busy?'disabled':'')+'>'+(S.busy?'…':'Start playing')+'</button>'+
    '<div class="eyebrow" style="text-align:center">or sign in</div>'+providers()+
    '<p class="small muted" style="text-align:center;margin:26px 0 0;opacity:.7">Spillin\' The Tea Trivia · brewtrivia.com</p>'+
  '</div>';
}
function visibleVenues(){
  var q = S.search.toLowerCase();
  var list = S.venues.filter(function(v){
    var hay = (v.name+' '+v.city+' '+v.state+' '+v.address).toLowerCase();
    return (!q || hay.indexOf(q)>=0) && (!S.tonightOnly || v.quiz_day===todayName());
  });
  if(S.coords){
    list.forEach(function(v){ v._mi = (v.lat!=null && v.lng!=null) ? miles(S.coords.lat,S.coords.lng,v.lat,v.lng) : null; });
    if(S.sortNear) list.sort(function(a,b){
      if(a._mi==null) return 1; if(b._mi==null) return -1; return a._mi-b._mi;
    });
  }
  return list;
}
function screenVenues(){
  var html = bar('Find trivia','Bars, breweries and taprooms')+'<div class="pane">'+
    '<input id="vsearch" placeholder="Search by bar, city or state" value="'+esc(S.search)+'" '+
      'oninput="S.search=this.value;renderKeepFocus()" style="margin-bottom:10px">'+
    '<div class="chips">'+
      '<button class="chip gold'+(S.tonightOnly?' on':'')+'" onclick="S.tonightOnly=!S.tonightOnly;render()">Tonight ('+todayName().slice(0,3)+')</button>'+
      '<button class="chip'+(S.sortNear?' on':'')+'" onclick="S.sortNear?(S.sortNear=false,render()):useMyLocation()">Near me</button>'+
    '</div>';
  var list = visibleVenues();
  if(!list.length) return html+'<div class="card muted" style="text-align:center;line-height:1.6">'+
    (S.venues.length?'No venues match. Clear the filters.':'No venues yet. Go to Me → List your venue.')+'</div></div>';
  list.forEach(function(v){
    html += '<div class="card'+(v.quiz_day===todayName()?' live':'')+'">'+
      '<div class="row" onclick="openVenue(\''+v.id+'\')" style="cursor:pointer">'+
        '<div class="grow"><div class="trunc" style="font-size:16px;font-weight:600">'+esc(v.name)+'</div>'+
        '<div class="trunc small muted" style="margin-top:3px">'+esc(v.city||'')+(v.state?', '+esc(v.state):'')+
          (v._mi!=null?' · '+v._mi.toFixed(1)+' mi':'')+'</div></div>'+
        '<span class="badge day">'+esc(v.quiz_day||'')+'</span></div>'+
      (v.prize?'<div style="margin-top:10px"><span class="badge prize">🏆 '+esc(v.prize)+'</span></div>':'')+
      '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">'+addrBtn(v)+'</div>'+
      '<div class="row small" style="margin-top:10px;gap:16px"><span class="gold">'+esc(v.start_time||'')+'</span>'+
      '<span class="teal">'+v.questionCount+' questions</span></div></div>';
  });
  return html+'</div>';
}
function renderKeepFocus(){
  render();
  var el = document.getElementById('vsearch');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function screenLobby(){
  var v=S.venue;
  var html = bar(v.name, v.quiz_day+' · '+v.start_time+' · code '+v.code, 'go(\'app\')')+'<div class="pane">'+
    '<div class="card"><div class="small muted">Tonight\'s trivia</div>'+
    '<div style="font-family:var(--display);font-size:24px;margin-top:2px">'+S.questions.length+' questions</div>'+
    '<div class="small teal" style="margin-top:4px">Written by the venue</div>'+
    (v.prize?'<div style="margin-top:10px"><span class="badge prize">🏆 '+esc(v.prize)+'</span></div>':'')+
    '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">'+addrBtn(v,'gold')+'</div></div>'+
    '<label><span>Team name</span><input id="team" placeholder="e.g. Quizzy McGuire" value="'+esc(S.team)+'"></label>'+
    '<div class="small muted" style="margin-bottom:8px">How many on your team?</div><div class="nums">';
  for(var n=1;n<=10;n++) html += '<button class="num'+(S.players===n?' on':'')+'" onclick="S.players='+n+';render()">'+n+'</button>';
  html += '</div><div class="small muted" style="margin-bottom:18px">'+(S.players===1?'Playing solo':S.players+' players on one team')+'</div>'+
    '<button class="btn" onclick="startQuiz()">Join tonight\'s game</button></div>';
  return html;
}
function screenQuiz(){
  var q=S.questions[S.qi], R=2*Math.PI*20;
  var html = bar('Question '+(S.qi+1)+'/'+S.questions.length, S.team+' · '+S.players+' player'+(S.players>1?'s':''),
    'clearInterval(S.timer);go(\'lobby\')')+
  '<div class="pane"><div class="row" style="margin-bottom:14px">'+
    '<svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="var(--line)" stroke-width="4"/>'+
    '<circle class="ring" cx="23" cy="23" r="20" fill="none" stroke="'+(S.left<=5?'var(--brick)':'var(--gold)')+'" stroke-width="4" stroke-linecap="round" '+
    'stroke-dasharray="'+R+'" stroke-dashoffset="'+(R*(1-S.left/20))+'" transform="rotate(-90 23 23)"/>'+
    '<text x="23" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="var(--cream)">'+S.left+'</text></svg>'+
    '<span class="badge day">'+esc(q.category||'Question')+'</span><span class="grow"></span>'+
    '<span class="card" style="padding:8px 12px;margin:0;color:var(--gold);font-weight:700">'+S.score+'</span></div>'+
  '<div style="font-family:var(--display);font-size:27px;line-height:1.3;margin-bottom:18px">'+esc(q.question)+'</div>';
  q.answers.forEach(function(opt,i){
    var cls = S.picked!==null && i===q.correct ? ' right' : (S.picked===i && i!==q.correct ? ' wrong' : '');
    html += '<button class="opt'+cls+'" onclick="answer('+i+')"><span class="key">'+KEYS[i]+'</span><span class="grow">'+esc(opt)+'</span></button>';
  });
  if(S.picked===-1) html += '<div class="small" style="color:var(--brick);text-align:center;margin-top:10px">Time\'s up.</div>';
  return html+'</div>';
}
function boardRows(mineCheck){
  return S.board.map(function(t,i){
    var mine = mineCheck(t);
    return '<div class="card'+(mine?' me':'')+'" style="padding:12px 14px;margin-bottom:8px"><div class="row">'+
      '<span style="width:18px;font-weight:700;opacity:.7">'+(i+1)+'</span>'+
      '<div class="grow"><div class="trunc" style="font-size:14.5px;font-weight:'+(mine?600:500)+'">'+esc(t.team_name)+'</div>'+
      '<div style="font-size:11.5px;opacity:.7">'+t.players+' player'+(t.players>1?'s':'')+'</div></div>'+
      '<span style="font-weight:700">'+t.score+'</span></div></div>';
  }).join('');
}
function screenResult(){
  var w = S.board[0] || {team_name:S.team, score:S.score, players:S.players, mine:true};
  var iWon = !!w.mine && w.team_name===S.team;
  var html = bar('Game over', S.venue.name)+'<div class="pane">'+
    '<div class="win"><div style="font-size:26px">🏆</div>'+
    '<div class="eyebrow" style="margin:0;color:#0A1330;opacity:.65">Winner</div>'+
    '<div class="who">'+(iWon?'You won':esc(w.team_name))+'</div>'+
    '<div class="small" style="opacity:.75;margin-top:4px">'+(iWon?esc(w.team_name)+' · ':'')+w.score+' points · '+w.players+' player'+(w.players>1?'s':'')+'</div>'+
    (S.venue.prize?'<div class="small" style="opacity:.75;margin-top:6px">Prize: '+esc(S.venue.prize)+'</div>':'')+'</div>'+
    '<div class="card" style="text-align:center;border-color:var(--gold)"><div class="small muted">Your score</div>'+
    '<div style="font-family:var(--display);font-size:52px;color:var(--gold);line-height:1.1">'+S.score+'</div>'+
    '<div class="small">Counted toward the national ranking too</div></div>'+
    '<div class="eyebrow"><span class="dot"></span>Tonight\'s standings — live</div>'+
    boardRows(function(t){ return !!t.mine && t.team_name===S.team; })+
    '<button class="btn" style="margin-top:12px" onclick="S.tab=\'rating\';S.screen=\'app\';loadRating(\'all\')">See national ranking</button>'+
    '<button class="btn ghost mt" onclick="S.tab=\'venues\';go(\'app\')">Find another venue</button>'+
    (S.anon?'<button class="btn ghost mt" onclick="go(\'auth\')">Sign in to keep your points on any phone</button>':'')+
    '</div>';
  return html;
}
function screenRating(){
  var html = bar('National ranking','Every player, every venue')+'<div class="pane"><div class="chips">'+
    '<button class="chip'+(S.range==='all'?' on':'')+'" onclick="loadRating(\'all\')">All time</button>'+
    '<button class="chip'+(S.range==='week'?' on':'')+'" onclick="loadRating(\'week\')">This week</button></div>';
  if(S.busy) return html+'<div class="spin"></div></div>';
  if(!S.rating.length) return html+'<div class="card muted" style="text-align:center">Nobody has played yet. Be the first.</div></div>';
  S.rating.forEach(function(p,i){
    var mine = !!p.mine;
    html += '<div class="card'+(mine?' me':'')+'" style="padding:12px 14px;margin-bottom:8px"><div class="row">'+
      '<span style="width:20px;font-weight:700;opacity:.7">'+(i+1)+'</span>'+
      '<div class="grow"><div class="trunc" style="font-size:14.5px;font-weight:'+(mine?600:500)+'">'+esc(p.display_name)+'</div>'+
      '<div style="font-size:11.5px;opacity:.7">'+p.games+' game'+(p.games>1?'s':'')+'</div></div>'+
      '<span style="font-weight:700">'+p.points+'</span></div></div>';
  });
  return html+'</div>';
}
function screenMe(){
  return bar('My profile', S.name)+'<div class="pane">'+
    '<div class="card row" style="justify-content:space-around;text-align:center">'+
      '<div><div class="gold" style="font-size:22px;font-weight:700">'+S.totalPoints+'</div><div class="small muted">Points</div></div>'+
      '<div><div class="gold" style="font-size:22px;font-weight:700">'+(S.myVenue?1:0)+'</div><div class="small muted">My venue</div></div></div>'+
    (S.anon
      ? '<button class="btn ghost" style="text-align:left;border-color:var(--gold)" onclick="go(\'auth\')">'+
          '<div style="font-weight:600">Playing as a guest on this phone</div>'+
          '<div class="small muted" style="margin-top:3px">Sign in with Google or email to keep your points everywhere</div></button>'
      : '<div class="card small muted">Signed in · points sync to every phone you sign in on</div>')+
    '<button class="btn ghost mt" style="text-align:left;border-color:var(--teal)" onclick="'+(S.myVenue?'openDash()':'go(\'signup\')')+'">'+
      '<div style="font-weight:600">'+(S.myVenue?'Host dashboard':'List your venue')+'</div>'+
      '<div class="small muted" style="margin-top:3px">'+(S.myVenue?esc(S.myVenue.name):'Bars, breweries, taprooms and restaurants')+'</div></button>'+
    '<button class="btn ghost mt" onclick="signOut()">Sign out</button></div>';
}
function screenSignup(){
  var v = S.myVenue||{};
  var html = bar('List your venue','Players find you by city, state or distance','go(\'app\')')+'<div class="pane">'+
    '<label><span>Venue name</span><input id="vname" placeholder="e.g. The Brass Tap" value="'+esc(v.name||'')+'"></label>'+
    '<label><span>Street address — players open it in Google Maps</span><input id="vaddr" placeholder="1120 Market St" value="'+esc(v.address||'')+'"></label>'+
    '<div class="half"><label><span>City</span><input id="vcity" placeholder="Philadelphia" value="'+esc(v.city||'')+'"></label>'+
    '<label style="max-width:110px"><span>State</span><input id="vstate" maxlength="2" placeholder="PA" value="'+esc(v.state||'')+'"></label></div>'+
    '<label><span>Prize (optional)</span><input id="vprize" placeholder="$50 bar tab" value="'+esc(v.prize||'')+'"></label>'+
    '<div class="small muted" style="margin-bottom:8px">Trivia night</div><div class="chips">';
  DAYS.forEach(function(d){
    var on = (S.newDay||v.quiz_day||'Wednesday')===d;
    html += '<button class="chip'+(on?' on':'')+'" onclick="S.newDay=\''+d+'\';render()">'+d.slice(0,3)+'</button>';
  });
  html += '</div><label style="margin-top:10px"><span>Start time</span><input id="vtime" placeholder="7:00 PM" value="'+esc(v.start_time||'7:00 PM')+'"></label>'+
    '<button class="btn teal" onclick="saveVenue()" '+(S.busy?'disabled':'')+'>'+(S.busy?'Saving…':'Save and write questions')+'</button>'+
    '<p class="small muted" style="line-height:1.6">The address is geocoded once so players can sort by distance. Time zone comes from the state.</p></div>';
  return html;
}
function screenEditor(){
  var html = bar('Write questions', S.myVenue.name+' · '+S.editorQs.length+' questions','openDash()')+'<div class="pane">'+
    '<div class="card">'+
    '<label><span>Question</span><textarea id="qtext" rows="2" placeholder="Type the question">'+esc(S.qdraft)+'</textarea></label>'+
    '<label><span>Category</span><input id="qcat" placeholder="e.g. Movies"></label>'+
    '<div class="small muted" style="margin-bottom:8px">Answers — tap the correct one</div>';
  for(var i=0;i<4;i++){
    html += '<div class="row" style="margin-bottom:8px">'+
      '<button class="num'+(S.correct===i?' on':'')+'" style="width:44px;height:46px;flex:0 0 auto" onclick="keepDraft();S.correct='+i+';render()">'+KEYS[i]+'</button>'+
      '<input id="a'+i+'" class="grow" placeholder="Answer '+KEYS[i]+'" value="'+esc((S.draft||[])[i]||'')+'"></div>';
  }
  html += '<button class="btn teal" style="margin-top:8px" onclick="addQuestion()" '+(S.busy?'disabled':'')+'>Add question</button></div>'+
    '<div class="eyebrow">Your question set</div>';
  if(!S.editorQs.length) html += '<div class="card muted small" style="text-align:center;line-height:1.6">No questions yet.</div>';
  S.editorQs.forEach(function(q,i){
    html += '<div class="card" style="padding:12px 14px"><div class="row" style="align-items:flex-start">'+
      '<span class="small muted" style="width:16px">'+(i+1)+'</span>'+
      '<div class="grow"><div style="font-size:14px;line-height:1.45">'+esc(q.question)+'</div>'+
      '<div class="small teal" style="margin-top:4px">Correct: '+esc(q.answers[q.correct])+'</div></div>'+
      '<button class="back" style="background:none;color:var(--brick);font-size:12px;width:auto" onclick="delQuestion(\''+q.id+'\')">Delete</button></div></div>';
  });
  return html+'</div>';
}
function screenDash(){
  var v=S.myVenue;
  var html = bar(v.name, v.quiz_day+' · '+v.start_time,'S.tab=\'me\';go(\'app\')')+'<div class="pane">'+
    '<div style="background:var(--teal);color:#0A1330;border-radius:18px;padding:18px;text-align:center;margin-bottom:12px">'+
      '<div class="small" style="font-weight:600;opacity:.75">Table join code</div>'+
      '<div class="code" style="font-size:34px">'+esc(v.code)+'</div>'+
      '<div class="small" style="opacity:.75">Put it on the table tents with a QR code to '+esc(location.host)+'</div></div>'+
    '<div class="card">'+addrBtn(v,'gold')+'<div class="small muted" style="margin-top:6px">This is what players see'+(v.lat==null?' · address could not be geocoded, distance sorting is off for this venue':'')+'</div></div>'+
    '<div class="card row" style="justify-content:space-around;text-align:center">'+
      '<div><div class="gold" style="font-size:22px;font-weight:700">'+S.editorQs.length+'</div><div class="small muted">Questions</div></div>'+
      '<div><div class="gold" style="font-size:22px;font-weight:700">'+S.board.length+'</div><div class="small muted">Teams tonight</div></div></div>'+
    '<button class="btn ghost" style="text-align:left;border-color:var(--teal)" onclick="openEditor()">'+
      '<div style="font-weight:600">Write and edit questions</div>'+
      '<div class="small muted" style="margin-top:3px">Only your game uses them</div></button>'+
    '<button class="btn ghost mt" style="text-align:left" onclick="go(\'signup\')"><div style="font-weight:600">Edit venue details</div></button>'+
    '<div class="eyebrow"><span class="dot"></span>Live scores</div>';
  if(!S.board.length) html += '<div class="card muted small" style="text-align:center">No teams have finished yet tonight.</div>';
  html += boardRows(function(){ return false; });
  return html+'</div>';
}
function tabsHtml(){
  var items=[['venues','📍','Venues'],['rating','🏆','Ranking'],['me','👤','Me']];
  return '<div class="tabs">'+items.map(function(t){
    return '<button class="tab'+(S.tab===t[0]?' on':'')+'" onclick="switchTab(\''+t[0]+'\')"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>';
  }).join('')+'</div>';
}
function switchTab(t){
  stopLive(); S.tab=t; S.screen='app';
  if(t==='rating') return loadRating(S.range);
  render();
}

/* ───────── render ───────── */
function render(){
  var html='';
  if(S.screen==='boot') html='<div class="spin"></div>';
  else if(S.screen==='setup') html=screenSetup();
  else if(S.screen==='error') html=bar('Something went wrong')+'<div class="pane"><div class="card">'+esc(S.toast)+'</div><button class="btn ghost" onclick="location.reload()">Reload</button></div>';
  else if(S.screen==='auth') html=screenAuth();
  else if(S.screen==='lobby') html=screenLobby();
  else if(S.screen==='quiz') html=screenQuiz();
  else if(S.screen==='result') html=screenResult();
  else if(S.screen==='signup') html=screenSignup();
  else if(S.screen==='editor') html=screenEditor();
  else if(S.screen==='dash') html=screenDash();
  else html=(S.tab==='venues'?screenVenues():S.tab==='rating'?screenRating():screenMe())+tabsHtml();
  if(S.toast && S.screen!=='error') html += '<div class="toast'+(S.toastOk?' ok':'')+'">'+esc(S.toast)+'</div>';
  document.getElementById('app').innerHTML = html;
}

boot();
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
