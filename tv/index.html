<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrewTrivia TV</title>
<meta name="theme-color" content="#0A1330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BrewTrivia TV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230A1330'/%3E%3Cpath d='M150 172h212v40h-86v168h-40V212h-86z' fill='%23E8A93C'/%3E%3Ccircle cx='256' cy='418' r='14' fill='%233FA093'/%3E%3Cpath d='M120 130c40-22 232-22 272 0' stroke='%233FA093' stroke-width='14' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0A1330; --deep:#0F1D45; --card:#16265A; --line:#283B75;
  --gold:#E8A93C; --gold-soft:rgba(232,169,60,.16); --brick:#C8492D; --teal:#3FA093;
  --cream:#F5EBD9; --muted:#93A4CE; --ink:#3B4A7A;
  --display:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --u:min(1vh, 0.5625vw);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;background:#050A1C;color:var(--cream);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body.idle:not(.setup-mode), body.idle:not(.setup-mode) *{cursor:none !important}

/* The stage fills the screen; the script sizes it and sets --u from the screen's shape (TV, iPad, phone). */
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;display:flex;flex-direction:column;
  padding:calc(var(--u)*4.2) calc(var(--u)*5.4) calc(var(--u)*3.8);
  background:radial-gradient(110% 85% at 12% 0%, #15275E 0%, var(--night) 58%), var(--night)}
@supports (padding:max(0px)){
  #stage{padding-top:max(calc(var(--u)*4.2), env(safe-area-inset-top));padding-right:max(calc(var(--u)*5.4), env(safe-area-inset-right));
    padding-bottom:max(calc(var(--u)*3.8), env(safe-area-inset-bottom));padding-left:max(calc(var(--u)*5.4), env(safe-area-inset-left))}
}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;height:calc(var(--u)*5);flex:0 0 auto}
.brand{display:flex;align-items:center;gap:calc(var(--u)*1.5);min-width:0}
.mark{width:calc(var(--u)*2.7);height:calc(var(--u)*3.8);flex:0 0 auto}
.word{font-family:var(--display);font-size:calc(var(--u)*3.5);line-height:1;white-space:nowrap}
.word b{font-weight:400;color:var(--gold)}
.sep{width:2px;height:calc(var(--u)*2.8);background:var(--line);flex:0 0 auto}
#venueName{font-weight:600;color:var(--muted);font-size:calc(var(--u)*2.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracker{display:flex;align-items:center;gap:calc(var(--u)*.9);flex:0 0 auto}
.tracker .lbl{font-size:calc(var(--u)*1.7);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-right:calc(var(--u)*.6);font-weight:600}
.pill{min-width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);padding:0 calc(var(--u)*1.4);border-radius:99px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--u)*2);color:var(--muted)}
.pill.done{border-color:transparent;background:rgba(245,235,217,.08);color:rgba(245,235,217,.5)}
.pill.now{border-color:var(--gold);background:var(--gold);color:var(--night)}

#scene{flex:1;min-height:0;position:relative;margin-top:calc(var(--u)*3.2)}
#scene > section{height:100%}

/* ---------- footer ---------- */
.foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*3);margin-top:calc(var(--u)*2.4);
  min-height:calc(var(--u)*4);font-size:calc(var(--u)*2.15);color:var(--muted)}
.foot b{color:var(--cream);font-weight:600}
.miniqr{display:flex;align-items:center;gap:calc(var(--u)*1.4);white-space:nowrap}
.miniqr .qr{width:calc(var(--u)*8.6);height:calc(var(--u)*8.6);padding:calc(var(--u)*.9);background:var(--cream);border-radius:calc(var(--u)*1.1);display:block}

.eyebrow{font-size:calc(var(--u)*2.1);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.tag{padding:calc(var(--u)*.75) calc(var(--u)*1.7);border-radius:99px;border:2px solid var(--line);font-size:calc(var(--u)*1.95);font-weight:600;color:var(--muted);white-space:nowrap}
.tag.gold{border-color:rgba(232,169,60,.6);color:var(--gold)}

.enter{animation:enter .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(calc(var(--u)*2.4))}to{opacity:1;transform:none}}

/* ---------- lobby ---------- */
.lobby{display:grid;grid-template-columns:1fr calc(var(--u)*46);grid-template-rows:1fr auto;column-gap:calc(var(--u)*7)}
.lobby .left{grid-column:1;grid-row:1;display:flex;flex-direction:column;min-height:0}
.lobby .right{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;justify-content:center}
.lobby .wall{grid-column:1;grid-row:2;padding-top:calc(var(--u)*2.6)}
.headline{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*10.6);line-height:.97;margin-top:calc(var(--u)*1.8);letter-spacing:-.012em}
.headline em{color:var(--gold)}
.steps{list-style:none;margin-top:calc(var(--u)*4.2);display:flex;flex-direction:column;gap:calc(var(--u)*1.9)}
.steps li{display:flex;align-items:center;gap:calc(var(--u)*2.1);font-size:calc(var(--u)*3.1);font-weight:500}
.steps .n{flex:0 0 auto;width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);border-radius:50%;border:2px solid var(--gold);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:calc(var(--u)*3.2);line-height:1}
.steps strong{color:var(--gold);font-weight:600}
.prize{margin-top:calc(var(--u)*3.6);align-self:flex-start;display:inline-flex;align-items:center;gap:calc(var(--u)*1.3);
  padding:calc(var(--u)*1.3) calc(var(--u)*2.6);border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:600;font-size:calc(var(--u)*2.6)}
.prize svg{width:calc(var(--u)*3);height:calc(var(--u)*3)}
.qrcard{background:var(--cream);color:var(--night);border-radius:calc(var(--u)*3.2);padding:calc(var(--u)*4.2) calc(var(--u)*4.2) calc(var(--u)*3.6);
  display:flex;flex-direction:column;align-items:center;box-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(0,0,0,.35)}
.qrcard .qr{width:calc(var(--u)*34);height:calc(var(--u)*34);display:block}
.qrcard .url{font-family:var(--display);font-size:calc(var(--u)*5);margin-top:calc(var(--u)*2.4);line-height:1}
.qrcard .code{margin-top:calc(var(--u)*1.3);font-size:calc(var(--u)*1.9);letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--ink)}
.wall .count{font-size:calc(var(--u)*2.3);color:var(--muted);font-weight:500;margin-bottom:calc(var(--u)*1.5)}
.wall .count b{color:var(--cream);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.1);max-height:calc(var(--u)*11.6);overflow:hidden}
.chip{padding:calc(var(--u)*.95) calc(var(--u)*2);border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:calc(var(--u)*2.3);font-weight:600;white-space:nowrap}
.chip.new{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;border-color:var(--gold)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* ---------- question ---------- */
.q{display:grid;grid-template-columns:1fr calc(var(--u)*28);column-gap:calc(var(--u)*5.5)}
.q .main{display:flex;flex-direction:column;min-height:0;min-width:0}
.qhead{display:flex;align-items:center;gap:calc(var(--u)*1.6);flex-wrap:wrap}
.qhead .eyebrow{margin-right:calc(var(--u)*.6)}
.qwrap{flex:1 1 0;min-height:0;display:flex;align-items:center;overflow:hidden;margin:calc(var(--u)*1.8) 0 calc(var(--u)*2.2)}
.qtext{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*9.4);line-height:1.06;letter-spacing:-.008em;width:100%}
.answers{margin-top:auto;display:grid;gap:calc(var(--u)*1.9);grid-template-columns:1fr 1fr}
.answers.c3{grid-template-columns:repeat(3,1fr)}
.tile{position:relative;display:flex;align-items:center;gap:calc(var(--u)*2.1);min-height:calc(var(--u)*12.4);padding:calc(var(--u)*1.9) calc(var(--u)*2.5);
  background:var(--card);border:2px solid var(--line);border-radius:calc(var(--u)*2.2);overflow:hidden;
  transition:opacity .55s, background-color .55s, border-color .55s, color .55s, transform .55s;
  animation:enter .4s cubic-bezier(.2,.7,.2,1) backwards}
.tile .bar{position:absolute;inset:0 auto 0 0;width:0;background:rgba(245,235,217,.08);transition:width 1s cubic-bezier(.2,.7,.2,1) .25s}
.tile .key{position:relative;flex:0 0 auto;width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);border-radius:calc(var(--u)*1.4);background:var(--deep);
  color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--u)*3.3)}
.tile .txt{position:relative;flex:1;min-width:0;font-size:calc(var(--u)*4.8);font-weight:600;line-height:1.12;max-height:calc(var(--u)*10);overflow:hidden}
.tile .cnt{position:relative;flex:0 0 auto;font-size:calc(var(--u)*2.4);font-weight:600;color:var(--muted);opacity:0;transition:opacity .4s .5s;white-space:nowrap}
.answers.tf .tile{justify-content:center;min-height:calc(var(--u)*17)}
.answers.tf .tile .txt{flex:0 1 auto;font-family:var(--display);font-weight:400;font-size:calc(var(--u)*8);text-align:center}
.answers.tf .tile .cnt{position:absolute;right:calc(var(--u)*2.5);bottom:calc(var(--u)*1.8)}
.q.reveal .tile{opacity:.34}
.q.reveal .tile .cnt{opacity:1}
.q.reveal .tile.ok{opacity:1;background:var(--teal);border-color:var(--teal);color:var(--night);transform:scale(1.02)}
.q.reveal .tile.ok .key{background:rgba(10,19,48,.18);color:var(--night)}
.q.reveal .tile.ok .cnt{color:var(--night)}
.q.reveal .tile.ok .bar{background:rgba(10,19,48,.13)}
.numpanel{margin-top:auto;display:flex;align-items:center;gap:calc(var(--u)*3.4);padding:calc(var(--u)*3.2) calc(var(--u)*3.6);
  border-radius:calc(var(--u)*2.4);background:var(--card);border:2px solid var(--line);transition:background-color .55s, border-color .55s, color .55s}
.numpanel .hash{font-family:var(--display);font-size:calc(var(--u)*13);line-height:.8;color:var(--gold)}
.numpanel .say{font-size:calc(var(--u)*3.8);font-weight:600}
.numpanel .sub{font-size:calc(var(--u)*2.3);color:var(--muted);margin-top:calc(var(--u)*.8)}
.numpanel .ans{font-family:var(--display);font-size:calc(var(--u)*13);line-height:.85}
.q.reveal .numpanel{background:var(--teal);border-color:var(--teal);color:var(--night)}
.q.reveal .numpanel .sub{color:rgba(10,19,48,.7)}

.rail{display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:0}
.status{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*1.2);min-height:calc(var(--u)*21)}
.status .ic{width:calc(var(--u)*9);height:calc(var(--u)*9)}
.status .st-main{font-size:calc(var(--u)*2.7);font-weight:600;line-height:1.2}
.status .st-sub{font-size:calc(var(--u)*2);color:var(--muted)}
.ring{position:relative;width:calc(var(--u)*16);height:calc(var(--u)*16)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--brick);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:calc(var(--u)*8.4);line-height:1}
.lastcall{font-size:calc(var(--u)*2.2);letter-spacing:.24em;text-transform:uppercase;color:var(--brick);font-weight:700}
.lastcall.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.glass{width:calc(var(--u)*19);height:calc(var(--u)*28.5);display:block}
#liquid{transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.bubbles circle{fill:rgba(255,246,220,.55);animation:rise 3.4s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-110px);opacity:0}}
.meter{text-align:center;margin-top:calc(var(--u)*1.6)}
.meter .val{font-size:calc(var(--u)*5.4);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.meter .val small{font-size:calc(var(--u)*3.2);color:var(--muted);font-weight:600}
.meter .lab{font-size:calc(var(--u)*2.15);color:var(--muted);margin-top:calc(var(--u)*.8);font-weight:500}
.q.reveal .meter .val{color:var(--teal)}

/* ---------- standings ---------- */
.standings{display:flex;flex-direction:column}
.st-title{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*7.6);line-height:1;margin-top:calc(var(--u)*1.4)}
.board{margin-top:calc(var(--u)*3.4);flex:1;min-height:0;display:grid;grid-auto-flow:column;column-gap:calc(var(--u)*4);row-gap:calc(var(--u)*1.4);
  grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),minmax(0,1fr))}
.row{position:relative;display:flex;align-items:center;gap:calc(var(--u)*2.2);padding:0 calc(var(--u)*2.6);border-radius:calc(var(--u)*1.8);
  background:var(--card);border:2px solid var(--line);overflow:hidden;min-height:0;animation:enter .55s cubic-bezier(.2,.7,.2,1) backwards}
.row .bar{position:absolute;inset:0 auto 0 0;width:0;background:rgba(245,235,217,.05);transition:width 1.1s cubic-bezier(.2,.7,.2,1) .3s}
.row .rk{position:relative;font-family:var(--display);font-size:calc(var(--u)*4.6);width:calc(var(--u)*5);color:var(--muted);line-height:1}
.row .nm{position:relative;flex:1;min-width:0;font-size:calc(var(--u)*3.3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pl{position:relative;font-size:calc(var(--u)*2);color:var(--muted);white-space:nowrap}
.row .sc{position:relative;font-size:calc(var(--u)*4.2);font-weight:700;font-variant-numeric:tabular-nums;min-width:calc(var(--u)*7);text-align:right}
.row.lead{border-color:var(--gold);background:linear-gradient(90deg, rgba(232,169,60,.24), rgba(232,169,60,.06))}
.row.lead .rk{color:var(--gold)}
.more{font-size:calc(var(--u)*2.2);color:var(--muted);margin-top:calc(var(--u)*1.6)}

/* ---------- finished ---------- */
.fin{display:grid;grid-template-columns:1.2fr 1fr;column-gap:calc(var(--u)*7)}
.champ{display:flex;flex-direction:column;justify-content:center;min-width:0}
.champ .name{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*14);line-height:.95;color:var(--gold);margin-top:calc(var(--u)*2.2);
  max-height:calc(var(--u)*28);overflow:hidden;animation:crown .9s cubic-bezier(.2,.8,.2,1.2) .15s both}
@keyframes crown{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.champ .meta{font-size:calc(var(--u)*3);margin-top:calc(var(--u)*2.6);font-weight:600}
.champ .meta span{color:var(--muted);font-weight:500}
.champ .won{margin-top:calc(var(--u)*2.6);align-self:flex-start}
.champ .thanks{margin-top:calc(var(--u)*5);font-size:calc(var(--u)*2.6);color:var(--muted);line-height:1.4}
.champ .thanks b{color:var(--cream);font-weight:600}
.rest{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.3);min-width:0}
.rest .row{min-height:calc(var(--u)*7.6);flex:0 0 auto}
.rest .hd{font-size:calc(var(--u)*1.9);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:calc(var(--u)*.6)}

/* ---------- setup / messages ---------- */
.setup,.msg{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.setup h1,.msg h1{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*8.6);line-height:1;margin-top:calc(var(--u)*1.6)}
.setup p,.msg p{font-size:calc(var(--u)*2.6);color:var(--muted);max-width:calc(var(--u)*96);margin-top:calc(var(--u)*2);line-height:1.45}
.search{margin-top:calc(var(--u)*3.6);width:calc(var(--u)*84);font:600 calc(var(--u)*3) var(--body);padding:calc(var(--u)*2) calc(var(--u)*2.6);
  border-radius:calc(var(--u)*1.8);background:var(--deep);border:2px solid var(--line);color:var(--cream);outline:none}
.search:focus{border-color:var(--gold)}
.search::placeholder{color:var(--muted);opacity:.7}
.vlist{margin-top:calc(var(--u)*1.8);width:calc(var(--u)*84);max-height:calc(var(--u)*36);overflow:auto;display:flex;flex-direction:column;gap:calc(var(--u)*1.1);text-align:left}
.vbtn{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*2) calc(var(--u)*2.6);border-radius:calc(var(--u)*1.8);
  background:var(--card);border:2px solid var(--line);color:var(--cream);font:600 calc(var(--u)*2.9) var(--body);cursor:pointer;text-align:left}
.vbtn small{font-size:calc(var(--u)*2.1);color:var(--muted);font-weight:500;white-space:nowrap}
.vbtn:hover,.vbtn:focus-visible{border-color:var(--gold);outline:none}
.hint{font-size:calc(var(--u)*2.3);color:var(--muted);padding:calc(var(--u)*2)}
.tip{font-size:calc(var(--u)*2.1) !important;margin-top:calc(var(--u)*2.6) !important}
kbd{display:inline-block;font:700 .85em var(--body);padding:.1em .5em;border-radius:.35em;border:1px solid var(--line);background:var(--deep);color:var(--cream)}
.btn{margin-top:calc(var(--u)*3.4);font:600 calc(var(--u)*2.6) var(--body);padding:calc(var(--u)*1.8) calc(var(--u)*3.4);border-radius:99px;border:0;background:var(--gold);color:var(--night);cursor:pointer}
.spin{width:calc(var(--u)*6);height:calc(var(--u)*6);border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- overlays ---------- */
.conn{position:fixed;top:2vh;right:2vh;background:var(--brick);color:var(--cream);font:600 1.7vh var(--body);padding:.9vh 1.8vh;border-radius:99px;z-index:5}
.conn[hidden]{display:none}
.controls{position:fixed;right:2vh;bottom:2vh;display:flex;gap:1vh;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
body.active .controls{opacity:1;pointer-events:auto}
.controls button{font:600 1.6vh var(--body);background:rgba(22,38,90,.94);color:var(--cream);border:1px solid var(--line);border-radius:99px;padding:1vh 1.8vh;cursor:pointer}
.controls button:hover{border-color:var(--gold)}
.controls button[hidden]{display:none}

/* ---------- 4:3 and 3:2 screens: iPad landscape, iPad mirrored to a TV ---------- */
.m-mid .lobby{grid-template-columns:1fr calc(var(--u)*40);column-gap:calc(var(--u)*5)}
.m-mid .headline{font-size:calc(var(--u)*8.8)}
.m-mid .steps{margin-top:calc(var(--u)*3.4)}
.m-mid .steps li{font-size:calc(var(--u)*2.8)}
.m-mid .qrcard{padding:calc(var(--u)*3.4) calc(var(--u)*3.4) calc(var(--u)*3)}
.m-mid .qrcard .qr{width:calc(var(--u)*30);height:calc(var(--u)*30)}

    if (!S.data) showMessage('Can’t reach BrewTrivia', 'Check this computer’s internet connection. Retrying on its own…', false);
    schedule(S.fail > 3 ? 4000 : 2000);
  });
}

/* ---------- state → scene ---------- */
function sceneOf(d){
  if (d.status === 'finished') return 'finished';
  if (d.status === 'standings') return 'standings';
  if ((d.status === 'open' || d.status === 'closing') && d.question) return 'q';
  return 'lobby';
}
function phaseOf(d){
  if (d.locked) return 'reveal';
  if (d.status === 'closing') return remaining(d) > 0 ? 'lastcall' : 'locking';
  return 'open';
}
function remaining(d){
  if (!d || !d.closes_at) return 0;
  return (Date.parse(d.closes_at) - (Date.now() + S.offset)) / 1000;
}

function apply(d){
  S.data = d;
  if (!d) { showMissing(); return; }
  document.body.classList.remove('setup-mode');
  $('#venueName').textContent = d.venue.name;
  $('#sep').hidden = false;
  setTracker(d);
  var scene = sceneOf(d), key;
  if (scene === 'q') key = 'q|' + d.question.id;
  else if (scene === 'standings') key = 'st|' + d.idx;
  else if (scene === 'lobby') key = 'lobby|' + d.status;
  else key = scene;
  if (key !== S.key) {
    S.key = key; S.phase = ''; S.teamSig = null; S.boardSig = null;
    if (scene === 'lobby') render(lobbyHTML(d), footPlay(false));
    else if (scene === 'q') render(questionHTML(d), footPlay(true));
    else if (scene === 'standings') render(standingsHTML(d), footPlay(true));
    else render(finishedHTML(d), footFinished());
  }
  if (scene === 'lobby') updateLobby(d);
  else if (scene === 'q') updateQuestion(d);
  else if (scene === 'standings') updateStandings(d);
}

function render(html, foot){
  $('#scene').innerHTML = html;
  $('#foot').innerHTML = foot || '';
  fitAll();
}

function setTracker(d){
  var tr = $('#tracker');
  var live = d.status === 'open' || d.status === 'closing' || d.status === 'standings';
  if (!live || !d.rounds) { tr.innerHTML = ''; return; }
  var cur = d.is_final ? 'F' : d.round_no, h = '<span class="lbl">Round</span>', r, cls;
  for (r = 1; r <= d.rounds; r++) {
    cls = (cur === 'F' || (cur && r < cur)) ? 'done' : (r === cur ? 'now' : '');
    h += '<span class="pill ' + cls + '">' + r + '</span>';
  }
  if (d.has_final) h += '<span class="pill ' + (cur === 'F' ? 'now' : '') + '">Final</span>';
  tr.innerHTML = h;
}

function footPlay(withQr){
  var v = S.data.venue;
  var left = withQr
    ? '<span>Play along at <b>brewtrivia.com</b> and choose <b>' + esc(v.name) + '</b></span>'
    : '<span>No app to download. It runs in your phone’s browser.</span>';
  return left + (withQr ? '<span class="miniqr"><span>Late? Scan to join</span>' + qrSVG('qr') + '</span>' : '');
}
function footFinished(){
  return '<span>Tonight’s points count toward the <b>BrewTrivia national ranking</b>.</span><span class="miniqr"><span>brewtrivia.com</span>' + qrSVG('qr') + '</span>';
}

/* ---------- lobby ---------- */
function lobbyHTML(d){

    '<div class="eyebrow">Tonight at ' + esc(v.name) + '</div>' +

      '<li><span class="n">1</span><span>Scan the code or go to <strong>brewtrivia.com</strong></span></li>' +
      '<li><span class="n">2</span><span>Choose <strong>' + esc(v.name) + '</strong></span></li>' +
      '<li><span class="n">3</span><span>Name your team and join</span></li>' +
    '</ol>' +
    (v.prize ? '<div class="prize">' + TROPHY + '<span>Tonight’s prize: ' + esc(v.prize) + '</span></div>' : '') +

      (v.code ? '<div class="code">Venue code ' + esc(v.code) + '</div>' : '') + '</div></div>' +

function updateLobby(d){
  var teams = d.teams || [];

    ? '<b>' + teams.length + '</b> ' + (teams.length === 1 ? 'team' : 'teams') + ' · <b>' + d.player_count + '</b> ' + (d.player_count === 1 ? 'player' : 'players') + ' in'
    : 'Waiting for the first team…';

  for (i = 0; i < shown.length; i++) {

    h += '<span class="chip' + (isNew ? ' new' : '') + '">' + esc(t.name) + '</span>';
  }

/* ---------- question ---------- */
function questionHTML(d){
  var q = d.question, t = q.type, head, body = '', ans, cls, i, keys = 'ABCDEFGH';
  if (d.is_final) {
    head = '<span class="eyebrow">Final question</span><span class="tag gold">Wager 0–' + esc(q.final_max) + (t !== 'num' ? ' · a wrong answer loses it' : '') + '</span>';
  } else {
    head = '<span class="eyebrow">Round ' + d.round_no + ' · Question ' + d.q_in_round + ' of ' + d.round_size + '</span><span class="tag">Wager 1–5</span>';
  }
  if (q.category) head += '<span class="tag">' + esc(q.category) + '</span>';
  if (t === 'multi') head += '<span class="tag gold">Pick all that apply</span>';

  if (t === 'num') {
    body = '<div class="numpanel" id="numpanel"><div class="hash">#</div><div><div class="say">Type your number on your phone</div>' +
           '<div class="sub">Exact answers score</div></div></div>';
  } else {
    ans = q.answers || [];
    cls = t === 'tf' ? 'tf' : (ans.length === 3 ? 'c3' : '');
    body = '<div class="answers ' + cls + '">';
    for (i = 0; i < ans.length; i++) {
      body += '<div class="tile" data-i="' + i + '" style="animation-delay:' + (0.08 + i * 0.05).toFixed(2) + 's"><div class="bar"></div>' +
              (t === 'tf' ? '' : '<span class="key">' + keys.charAt(i) + '</span>') +
              '<span class="txt">' + esc(ans[i]) + '</span><span class="cnt"></span></div>';
    }
    body += '</div>';
  }
  return '<section class="q enter" id="q"><div class="main"><div class="qhead">' + head + '</div>' +
    '<div class="qwrap" id="qwrap"><h2 class="qtext" id="qtext">' + esc(q.text) + '</h2></div>' + body + '</div>' +
    '<aside class="rail"><div class="status" id="qstatus"></div>' + glassSVG() +
    '<div class="meter"><div class="val" id="meterVal"></div><div class="lab" id="meterLab"></div></div></aside></section>';
}
function updateQuestion(d){
  var phase = phaseOf(d), box = $('#q');
  if (!box) return;
  if (phase !== S.phase) {
    S.phase = phase;
    box.classList.toggle('reveal', phase === 'reveal');
    var st = $('#qstatus');
    if (phase === 'open') {
      st.innerHTML = PHONE + '<div class="st-main">Answer on<br>your phone</div>';
    } else if (phase === 'lastcall') {
      st.innerHTML = '<div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/>' +
        '<circle class="fg" id="ringFg" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>' +
        '<div class="num" id="cdNum"></div></div><div class="lastcall pulse">Last call</div>';
      tickCountdown();
    } else if (phase === 'locking') {
      st.innerHTML = LOCK + '<div class="st-main">Answers locked</div>';
    } else {
      st.innerHTML = CHECK + '<div class="st-main">The answer</div>';
    }
  }
  if (phase === 'reveal') {
    showReveal(d);
    var r = d.reveal || {}, got = r.correct_count || 0;
    $('#meterVal').innerHTML = d.answered ? got + '<small>/' + d.answered + '</small>' : '0';
    $('#meterLab').textContent = d.answered ? (d.question.type === 'multi' ? 'teams scored' : 'teams got it') : 'no answers this time';
    setGlass(d.answered ? got / d.answered : 0);
  } else {
    $('#meterVal').innerHTML = d.answered + '<small>/' + d.team_count + '</small>';
    $('#meterLab').textContent = d.team_count === 1 ? 'team answered' : 'teams answered';
    setGlass(d.team_count ? d.answered / d.team_count : 0);
  }
}
function showReveal(d){
  var r = d.reveal, q = d.question;
  if (!r) return;
  if (q.type === 'num') {
    var tol = Number(r.num_tolerance) || 0;
    $('#numpanel').innerHTML = '<div class="ans">' + fmtNum(r.correct_num) + '</div>' +
      (tol > 0 ? '<div><div class="say">Anything within ±' + fmtNum(tol) + ' counts</div></div>' : '');
    return;
  }
  var ok = q.type === 'multi' ? (r.correct_set || []) : [r.correct];
  var dist = r.dist || [], total = Math.max(1, d.answered);
  Array.prototype.forEach.call(document.querySelectorAll('#q .tile'), function(el){
    var i = Number(el.getAttribute('data-i')), c = dist[i] || 0;
    el.classList.toggle('ok', ok.indexOf(i) !== -1);
    el.querySelector('.cnt').textContent = plural(c, 'team');
    el.querySelector('.bar').style.width = (c / total * 100).toFixed(1) + '%';
  });
}
function tickCountdown(){
  var d = S.data;
  if (!d || S.phase !== 'lastcall') return;
  var left = remaining(d), num = $('#cdNum'), fg = $('#ringFg');
  if (num) num.textContent = Math.max(0, Math.ceil(left));
  if (fg) fg.setAttribute('stroke-dashoffset', (276.46 * (1 - Math.max(0, Math.min(1, left / LAST_CALL_SECONDS)))).toFixed(1));
  if (left <= 0 && !S.locking) {
    S.locking = true;
    updateQuestion(d);
    setTimeout(function(){ S.locking = false; poll(); }, 150);
  }
}
setInterval(tickCountdown, 200);

/* ---------- standings ---------- */
function ranked(teams){
  var out = [], i, rank = 0, prev = null;
  for (i = 0; i < teams.length; i++) {
    if (prev === null || teams[i].score !== prev) rank = i + 1;
    prev = teams[i].score;
    out.push({ rank: rank, t: teams[i] });
  }
  return out;
}
function standingsTitle(d){
  if (d.idx == null) return 'Standings';
  if (d.is_final) return 'After the final question';
  if (d.q_in_round === d.round_size) return 'After round ' + d.round_no;
  return 'Round ' + d.round_no + ' · after question ' + d.q_in_round;
}
function rowHTML(x, top, i){
  var w = top > 0 ? Math.max(0, x.t.score) / top * 100 : 0;
  return '<div class="row' + (x.rank === 1 && x.t.score > 0 ? ' lead' : '') + '" style="animation-delay:' + (0.1 + i * 0.06).toFixed(2) + 's">' +
    '<div class="bar" data-w="' + w.toFixed(1) + '"></div><span class="rk">' + x.rank + '</span>' +
    '<span class="nm">' + esc(x.t.name) + '</span><span class="pl">' + plural(x.t.players, 'player') + '</span>' +
    '<span class="sc">' + x.t.score + '</span></div>';
}
function boardHTML(teams){
  if (!teams.length) return '<div class="hint">No teams yet.</div>';
  var tall = S.mode === 'tall';
  var list = ranked(teams), max = tall ? 10 : 14, shown = list.slice(0, max);
  var cols = !tall && shown.length > 7 ? 2 : 1;
  var rows = cols === 1 ? Math.max(shown.length, 5) : Math.max(Math.ceil(shown.length / 2), 5);
  var top = Math.max(0, teams[0].score), h = '', i;
  for (i = 0; i < shown.length; i++) h += rowHTML(shown[i], top, i);
  return '<div class="board" style="--cols:' + cols + ';--rows:' + rows + '">' + h + '</div>' +
    (list.length > max ? '<div class="more">+ ' + plural(list.length - max, 'more team') + '</div>' : '');
}
function standingsHTML(d){
  return '<section class="standings enter"><div class="eyebrow">Standings</div><h1 class="st-title">' + esc(standingsTitle(d)) + '</h1>' +
    '<div id="boardWrap" style="display:flex;flex-direction:column;flex:1;min-height:0">' + boardHTML(d.teams || []) + '</div></section>';
}
function growBars(){
  setTimeout(function(){
    Array.prototype.forEach.call(document.querySelectorAll('.row .bar[data-w]'), function(b){ b.style.width = b.getAttribute('data-w') + '%'; });
  }, 30);
}
function updateStandings(d){
  var sig = JSON.stringify(d.teams || []);
  if (sig === S.boardSig) return;
  var first = S.boardSig === null;
  S.boardSig = sig;
  if (!first) $('#boardWrap').innerHTML = boardHTML(d.teams || []);
  growBars();
}

/* ---------- finished ---------- */
function finishedHTML(d){
  var v = d.venue, teams = d.teams || [];
  var next = v.quiz_day ? 'Trivia’s back <b>' + esc(v.quiz_day) + (v.start_time ? ' at ' + esc(v.start_time) : '') + '</b>.' : '';
  if (!teams.length) {
    return '<section class="msg enter"><div class="eyebrow">That’s a wrap</div><h1>Thanks for coming out.</h1>' + (next ? '<p>' + next + '</p>' : '') + '</section>';
  }
  var top = teams[0].score, winners = teams.filter(function(t){ return t.score === top; }), tie = winners.length > 1;
  var players = winners.reduce(function(a, t){ return a + (t.players || 0); }, 0);
  var rest = ranked(teams).filter(function(x){ return x.t.score !== top; }).slice(0, S.mode === 'tall' ? 5 : 7), h = '', i;
  for (i = 0; i < rest.length; i++) h += rowHTML(rest[i], top, i + 2);
  return '<section class="fin enter"><div class="champ">' +
      '<div class="eyebrow">' + (tie ? 'Tied for first' : 'Tonight’s winner') + '</div>' +
      '<h1 class="name" id="champName">' + winners.map(function(t){ return esc(t.name); }).join(' <em>&amp;</em> ') + '</h1>' +
      '<div class="meta">' + plural(top, 'point') + ' <span>· ' + plural(players, 'player') + '</span></div>' +
      (v.prize ? '<div class="prize won">' + TROPHY + '<span>' + (tie ? 'Sharing ' : 'Wins ') + esc(v.prize) + '</span></div>' : '') +
      '<p class="thanks">Thanks for playing! ' + next + '</p>' +
    '</div><div class="rest">' + (rest.length ? '<div class="hd">Final standings</div>' + h : '') + '</div></section>';
}

/* ---------- fitting long text ---------- */
function fit(el, maxU, minU, limit){
  if (!el) return;
  var inner = el.firstElementChild;
  if (!inner || inner.className !== 'fi') {
    inner = document.createElement('span'); inner.className = 'fi';
    while (el.firstChild) inner.appendChild(el.firstChild);
    el.appendChild(inner);
  }
  var u = U(), s = maxU, guard = 60;
  function over(){
    var lh = parseFloat(getComputedStyle(el).lineHeight) || s * u * 1.1;
    var max = typeof limit === 'function' ? limit() : parseFloat(getComputedStyle(el).maxHeight);
    var tall = isFinite(max) && max > 0 && inner.getClientRects().length * lh > max + 0.5;
    return tall || inner.getBoundingClientRect().width > el.clientWidth + 1;
  }
  el.style.fontSize = (s * u) + 'px';
  while (guard-- > 0 && s > minU && over()) { s *= 0.95; el.style.fontSize = (s * u) + 'px'; }
}
function fitAll(){
  var wrap = $('#qwrap');
  if (wrap) fit($('#qtext'), 9.4, 4.4, function(){ return wrap.clientHeight; });
  var tf = document.querySelector('.answers.tf');
  Array.prototype.forEach.call(document.querySelectorAll('.tile .txt'), function(el){ fit(el, tf ? 8 : 4.8, 2.4); });
  fit($('#champName'), S.mode === 'tall' ? 11 : 14, 6);
  fitLobby();
  growBars();
}
/* The QR card takes whatever room is left; on an upright iPad the step list gives way to a one-line hint. */
function fitLobby(){
  var sec = document.querySelector('.lobby');
  if (!sec) return;
  var right = sec.querySelector('.right'), card = sec.querySelector('.qrcard'), qr = card && card.querySelector('.qr');
  if (!right || !qr) return;
  var u = U(), base = S.mode === 'wide' ? 34 : 30, size = base;
  function room(){ var cs = getComputedStyle(right); return right.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom); }
  function setQ(n){ size = n; qr.style.width = qr.style.height = (n * u).toFixed(1) + 'px'; }
  function shrink(min){ setQ(base); var g = 40; while (g-- > 0 && size > min && card.offsetHeight > room() + 0.5) setQ(size - 1); }
  sec.classList.remove('compact');
  shrink(24);
  if (S.mode === 'tall' && card.offsetHeight > room() + 0.5) { sec.classList.add('compact'); shrink(16); }
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function(){ setTimeout(layout, 250); });
if (document.fonts) {
  if (document.fonts.ready) document.fonts.ready.then(fitAll);
  if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fitAll);
}

/* ---------- TV niceties: full screen, keep awake, hide cursor ---------- */
var wakeLock = null;
function wake(){
  try {
    if ('wakeLock' in navigator && !document.hidden && (!wakeLock || wakeLock.released)) {
      navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; }).catch(function(){});
    }
  } catch(e){}
}
function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
function canFull(){
  var el = document.documentElement;
  if (STANDALONE) return false;                       // opened from the Home Screen: already full screen
  if (!(el.requestFullscreen || el.webkitRequestFullscreen)) return false;
  return document.fullscreenEnabled !== false && document.webkitFullscreenEnabled !== false;
}
function toggleFull(){
  try {
    if (fsElement()) {
      if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      var el = document.documentElement, r = null;
      if (el.requestFullscreen) r = el.requestFullscreen();
      else if (el.webkitRequestFullscreen) r = el.webkitRequestFullscreen();
      if (r && r.catch) r.catch(function(){});
    }
  } catch(e){}
  wake();
}
function setupTip(){
  if (!TOUCH) return 'Then press <kbd>F</kbd> for full screen. Move the mouse anytime to change venue.';
  var t = 'Tap the screen anytime to change venue' + (canFull() ? ' or go full screen.' : '.');
  if (IS_IOS && !STANDALONE) t += ' On iPad, tap <b>Share → Add to Home Screen</b> and open it from there for a clean full screen.';
  return t;
}
var idleT = null, shownAt = 0;
function active(){
  if (!document.body.classList.contains('active')) shownAt = Date.now();
  document.body.classList.add('active'); document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(function(){ document.body.classList.remove('active'); document.body.classList.add('idle'); }, TOUCH ? 5000 : 2500);
  if (TOUCH) wake();
}
// On a touch screen the first tap only shows the buttons, so it can't press one by accident.
function guarded(fn){ return function(e){ if (TOUCH && Date.now() - shownAt < 450) return; fn(e); }; }
['mousemove', 'mousedown', 'touchstart'].forEach(function(ev){ window.addEventListener(ev, active, { passive: true }); });
document.addEventListener('keydown', function(e){
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'f' || e.key === 'F') toggleFull();
  if (e.key === 'c' || e.key === 'C') showSetup();
});
$('#btnFull').hidden = !canFull();
$('#btnFull').addEventListener('click', guarded(toggleFull));
$('#btnVenue').addEventListener('click', guarded(showSetup));
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { wake(); if (S.venueId) poll(); } });

/* ---------- start ---------- */
function boot(){
  layout();
  var p = new URLSearchParams(window.location.search);
  var id = p.get('venue') || lsGet();
  var code = p.get('code');
  var uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  if (code && !p.get('venue')) {
    loadVenues().then(function(vs){
      var m = vs.filter(function(v){ return (v.code || '').toUpperCase() === code.toUpperCase(); })[0];
      if (m) choose(m.id); else showSetup();
    }).catch(showSetup);
    return;
  }
  if (id && uuid.test(id)) choose(id); else showSetup();
  wake();
}
boot();
})();
</script>
